<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indy 500 Flashcard Game - 110th Running</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,900;1,300;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Menu Screen -->
    <div id="menu-screen" class="screen active">
        <div class="menu-container">
            <h1 class="title">Flashcard Challenge</h1>
            <br>
            <img src="img/logo.svg.png" alt="Indy 500 Logo" class="menu-logo" />
            <br>
            <div class="menu-section">
                <h3>Game Mode</h3>
                <div class="menu-grid mode-grid-4">
                    <button class="menu-btn mode-btn selected" data-mode="driver">Driver</button>
                    <button class="menu-btn mode-btn" data-mode="team">Team</button>
                    <button class="menu-btn mode-btn" data-mode="manufacturer">Manufacturer</button>
                    <button class="menu-btn mode-btn" data-mode="study">Study</button>
                </div>
            </div>

            <div class="menu-section">
                <h3>Difficulty</h3>
                <div class="menu-grid diff-grid-3">
                    <button class="menu-btn difficulty-btn" data-difficulty="easy" data-time="10">Easy</button>
                    <button class="menu-btn difficulty-btn selected" data-difficulty="medium" data-time="5">Medium</button>
                    <button class="menu-btn difficulty-btn" data-difficulty="hard" data-time="3">Hard</button>
                </div>
            </div>

            <button id="start-btn" class="start-btn">
                BEGIN
            </button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <div class="progress-info">
                <span id="question-counter">1 / 33</span>
            </div>
            <div class="timer-container">
                <div id="timer-bar" class="timer-bar"></div>
                <span id="timer-text" class="timer-text">5s</span>
            </div>
            <div class="score-info">
                <span id="score-display">Score: 0</span>
            </div>
        </div>

        <div class="game-body">
            <div id="car-display-text" class="car-display-text">
                <h1>Who drives this car?</h1>
            </div>

            <div id="car-display" class="car-display">
                <!-- Car image injected here -->
            </div>

            <div id="choices" class="choices">
                <!-- Choice buttons injected here -->
            </div>

            <div id="feedback" class="feedback hidden"></div>
                
            <button id="continue-btn" class="continue-btn hidden">Next</button>
        </div>
    </div>

    <!-- Study Screen -->
    <div id="study-screen" class="screen">
        <div class="study-container">
            <div class="study-header">
                <h1>Study Mode</h1>
                <p>Browse all 33 cars and their drivers</p>
                <button id="study-back-btn" class="menu-btn">← Back to Menu</button>
            </div>
            <div id="study-grid" class="study-grid">
                <!-- Cards injected by JS -->
            </div>
        </div>
    </div>

    <!-- Results Screen -->
    <div id="results-screen" class="screen">
        <div class="results-container">
            <div id="results-icon" class="results-icon"></div>
            <h1 id="results-title" class="results-title"></h1>
            <p id="results-message" class="results-message"></p>
            <div id="results-score" class="results-score"></div>
            <div id="results-details" class="results-details"></div>
            <div id="high-scores" class="high-scores"></div>
            <button id="play-again-btn" class="start-btn">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
